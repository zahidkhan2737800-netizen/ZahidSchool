<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Complaint Message Configuration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; }
        .wrap { max-width: 800px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #4338ca; display: flex; align-items: center; gap: 10px; }
        textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; resize: vertical; font-size: 1rem; box-sizing: border-box; }
        .btn { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #4338ca; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { text-decoration: none; color: #4f46e5; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="nav-links">
            <a href="dashboard.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
        <h2><i class="fas fa-comment-dots"></i> Configure Fee Complaint Message</h2>
        <p style="color: #64748b; font-size: 0.95rem;">
            This message will be automatically logged to the Complaint Diary when you click the <strong>"C"</strong> button in the Student Fee Contacts view.
        </p>
        
        <textarea id="msgText" placeholder="Enter the default fee complaint text... e.g. Student has pending fee dues. Please contact parents."></textarea>
        
        <button id="saveBtn" class="btn"><i class="fas fa-save"></i> Save Message</button>
        <span id="saveStatus" style="margin-left:15px; color:#16a34a; font-weight:bold; display:none;">Saved successfully!</span>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkAuth = setInterval(async () => {
                if (window.authReady && window.supabaseClient) {
                    clearInterval(checkAuth);
                    loadMsg();
                }
            }, 100);
        });

        async function loadMsg() {
            try {
                // Try to find an existing fee complaint template in wa_templates
                const { data, error } = await window.supabaseClient
                    .from('wa_templates')
                    .select('*')
                    .eq('title', 'FEE_COMPLAINT_AUTO_MSG')
                    .limit(1)
                    .single();
                
                if (data && data.message_text) {
                    document.getElementById('msgText').value = data.message_text;
                    window.templateId = data.id;
                }
            } catch (err) {
                console.log("No existing template found or error", err);
            }
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const text = document.getElementById('msgText').value.trim();
            if (!text) return alert("Message cannot be empty!");

            try {
                const payload = {
                    title: 'FEE_COMPLAINT_AUTO_MSG',
                    message_text: text,
                    is_default: false
                };
                
                if (window.currentSchoolId) {
                    payload.school_id = window.currentSchoolId;
                }

                if (window.templateId) {
                    payload.id = window.templateId;
                }

                const { data, error } = await window.supabaseClient
                    .from('wa_templates')
                    .upsert(payload)
                    .select();
                
                if (error) throw error;

                if (data && data[0]) {
                    window.templateId = data[0].id;
                }

                const status = document.getElementById('saveStatus');
                status.style.display = 'inline';
                setTimeout(() => status.style.display = 'none', 3000);
            } catch (err) {
                console.error(err);
                alert("Failed to save message.");
            }
        });
    </script>
</body>
</html>
