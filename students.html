<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Students - Zahid School System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            /* Professional Blue */
            --primary-hover: #1d4ed8;
            --bg-color: #f0f4f8;
            /* Crisp light gray-blue background */
        }

        body {
            background-color: var(--bg-color);
        }

        .dashboard-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            margin: 0 auto;
        }

        .filter-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.4rem;
        }

        .filter-group input,
        .filter-group select {
            padding: 0.75rem 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: var(--primary);
        }

        .whatsapp-group-select {
            min-width: 68px;
            padding: 0.42rem;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #64748b;
            font-weight: 700;
            cursor: pointer;
        }

        .whatsapp-group-select.is-added {
            border-color: #22c55e;
            background: #dcfce7;
            color: #166534;
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            height: 44px;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: var(--primary-hover);
        }

        .data-table-container {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            text-align: left;
            padding: var(--table-td-pad, 10px 14px);
            border: 1px solid #e2e8f0;
            font-size: var(--table-font-size, 0.95rem);
        }

        th {
            background-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: var(--table-font-size, 0.85rem);
            letter-spacing: 0.05em;
            border: 1px solid var(--primary-hover);
            padding: var(--table-th-pad, 10px 14px);
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover td {
            background-color: #e0f2fe;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0;
            align-items: center;
        }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #eff6ff;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid #bfdbfe;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .nav-links a:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        /* Inline editing styles */
        .editable-cell {
            position: relative;
            cursor: text;
            transition: background 0.2s;
            border-bottom: 1px dashed transparent;
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        .editable-cell:hover {
            background-color: #fef9c3;
            border-bottom: 1px dashed #ca8a04;
        }

        .editable-cell:focus {
            background-color: #fff;
            outline: 2px solid var(--primary);
            border-radius: 4px;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            user-select: text !important;
        }

        .delete-btn {
            background-color: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background-color: #fca5a5;
        }

        .slider-field {
            display: flex;
            flex-direction: column;
            min-width: 130px;
        }

        .slider-field label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
        }

        @media print {
            body { background: white !important; }
            header, .dashboard-stats, .filter-panel, .delete-btn, .nav-links { display: none !important; }
            .dashboard-panel { border: none !important; box-shadow: none !important; padding: 0 !important; }
            th, td {
                font-size: var(--print-font-size, 9px) !important;
                padding: var(--print-td-pad, 2px 4px) !important;
            }
            th { padding: var(--print-th-pad, 3px 4px) !important; }
            @page { margin: 10mm; }
        }
    </style>
</head>

<body>
    <div style="width: 100%; padding: 1.5rem; max-width: 1600px; margin: 0 auto;">

        <div class="dashboard-panel">
            <div class="dashboard-stats"
                style="display:flex; justify-content:center; gap:2rem; margin-bottom:1.5rem; padding: 1rem; background: #eff6ff; border-radius: 8px; border: 1px solid #bfdbfe;">
                <div style="text-align:center;">
                    <h3
                        style="margin:0; font-size:1rem; color: #1e40af; text-transform: uppercase; letter-spacing: 0.05em;">
                        Total Active Students</h3>
                    <p id="totalActive" style="margin:0.2rem 0 0; font-size:2.5rem; font-weight:800; color: #1e3a8a;">0
                    </p>
                </div>
            </div>

            <div class="filter-panel">
                <div class="filter-group">
                    <label for="searchQuery">Search (Name or Roll Number)</label>
                    <input type="text" id="searchQuery" placeholder="e.g. Ali, Khan, or 104">
                </div>
                <div class="filter-group">
                    <label for="searchClass">Class</label>
                    <select id="searchClass"
                        style="padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; background: white;">
                        <option value="">All Classes</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="mobileNumberFilter">Mobile Number</label>
                    <select id="mobileNumberFilter">
                        <option value="All" selected>All Mobile Numbers</option>
                        <option value="Invalid">Missing / Not 11 Digits</option>
                        <option value="Valid">Valid 11-Digit Numbers</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="whatsappNumberFilter">WhatsApp Number</label>
                    <select id="whatsappNumberFilter">
                        <option value="All" selected>All WhatsApp Numbers</option>
                        <option value="Invalid">Missing / Not 11 Digits</option>
                        <option value="Valid">Valid 11-Digit Numbers</option>
                    </select>
                </div>
                <div class="slider-field">
                    <label for="fontSizeRange">Font Size <span id="fontSizeValue">14px</span></label>
                    <input type="range" id="fontSizeRange" min="7" max="20" step="0.5" value="14">
                </div>
                <div class="slider-field">
                    <label for="compactnessRange">Compactness <span id="compactnessValue">20%</span></label>
                    <input type="range" id="compactnessRange" min="0" max="100" step="5" value="20">
                </div>
                <button id="printBtn" class="search-btn" style="background:#10b981; margin-left: auto;">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>

            <div class="data-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Roll #</th>
                            <th>Student Name</th>
                            <th>Class</th>
                            <th>Father Name</th>
                            <th>Father Mobile</th>
                            <th>WhatsApp</th>
                            <th>WhatsApp Group</th>
                            <th>Added On</th>
                            <th>Status Action</th>
                            <th>Delete Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody">
                        <tr>
                            <td colspan="10" class="empty-state">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="students.js?v=6"></script>
</body>

</html>
